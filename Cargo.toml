[package]
name = "ac-signalr-server"
version = "0.1.0"
edition = "2021"
authors = ["SDGM"]
description = "SignalR server utilities for hosting Axum-based hubs with JSON and MessagePack support"
license = "MIT"
repository = "https://github.com/Acelerar/ac-signalr-server-lib-rs"
homepage = "https://github.com/Acelerar/ac-signalr-server-lib-rs"
documentation = "https://docs.rs/ac-signalr-server"
readme = "README.md"
keywords = ["signalr", "axum", "websocket", "tokio"]
categories = ["asynchronous", "network-programming", "web-programming"]

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
fastwebsockets = { version = "0.10.0", features = ["upgrade", "with_axum", "unstable-split"] }
hyper = { version = "1.9.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rmp-serde = "1.3.1"
rmpv = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
chrono = "0.4.44"
http-body-util = "0.1.3"
rand = "0.10.1"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
